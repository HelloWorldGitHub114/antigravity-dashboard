name: Native Build Matrix
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'native/**'
      - 'tools/build.mjs'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
            node_artifact: sidecars/panel/pulse-accel.win32-x64.node
            cli_artifact: cli/bin/ag-pulse-statusline.win32-x64.exe
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            node_artifact: sidecars/panel/pulse-accel.darwin-arm64.node
            cli_artifact: cli/bin/ag-pulse-statusline.darwin-arm64
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            cross: true
            node_artifact: sidecars/panel/pulse-accel.darwin-x64.node
            cli_artifact: cli/bin/ag-pulse-statusline.darwin-x64
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            node_artifact: sidecars/panel/pulse-accel.linux-x64.node
            cli_artifact: cli/bin/ag-pulse-statusline.linux-x64
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            node_artifact: sidecars/panel/pulse-accel.linux-arm64.node
            cli_artifact: cli/bin/ag-pulse-statusline.linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux ARM64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Install esbuild for build script
        run: npm install --no-save --package-lock=false esbuild@^0.28.2
      - name: Run Rust unit tests (native runner)
        if: matrix.cross == false
        working-directory: native/pulse-accel
        run: cargo test --manifest-path Cargo.toml
      - name: Build tagged native addon and statusline CLI
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: node tools/build.mjs --native-tag --target ${{ matrix.target }}
      - name: Verify tagged artifacts exist
        shell: bash
        run: |
          test -f "${{ matrix.node_artifact }}"
          test -f "${{ matrix.cli_artifact }}"
      - name: Verify host native CLI smoke test
        if: matrix.cross == false
        shell: bash
        run: |
          "${{ matrix.cli_artifact }}" --preview --json | node -e "const d = JSON.parse(require('fs').readFileSync(0,'utf8')); if (!d.context || d.context.usedPercentage !== 44.2) process.exit(1);"
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-native-${{ matrix.name }}
          path: |
            ${{ matrix.node_artifact }}
            ${{ matrix.cli_artifact }}
