name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  host-resources:
    uses: ./.github/workflows/host-resources.yml
    permissions:
      contents: read
  native:
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: node tools/build.mjs --check
      - run: npm test
      - name: Stream a synthetic corpus above the former 512 MiB cap
        run: node --expose-gc tools/check-trajectory-resources.mjs 640 1024
      - name: Reject over-budget projected statistics without partial cache
        run: node --expose-gc tools/check-trajectory-resources.mjs 0 32768 --expect-budget-rejection
      - run: node --test ide/tests/*.test.mjs
      - run: python -m unittest discover -s tests -v
      - name: Install Chromium for shared UI regressions
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: node tools/check-ide-ui.mjs
      - run: npm run test:usage-ui
      - run: npm run test:panel-ui
      - run: python manage.py package
      - run: python ide/package.py
  release:
    needs: [verify, host-resources, native]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download prebuilt native binaries from matrix
        uses: actions/download-artifact@v4
        with:
          pattern: pulse-native-*
          merge-multiple: true
      - name: Verify all 5 platforms' native binaries are staged
        shell: pwsh
        run: |
          $expected = @(
            'sidecars/panel/pulse-accel.win32-x64.node',
            'sidecars/panel/pulse-accel.darwin-arm64.node',
            'sidecars/panel/pulse-accel.darwin-x64.node',
            'sidecars/panel/pulse-accel.linux-x64.node',
            'sidecars/panel/pulse-accel.linux-arm64.node',
            'cli/bin/ag-pulse-statusline.win32-x64.exe',
            'cli/bin/ag-pulse-statusline.darwin-arm64',
            'cli/bin/ag-pulse-statusline.darwin-x64',
            'cli/bin/ag-pulse-statusline.linux-x64',
            'cli/bin/ag-pulse-statusline.linux-arm64'
          )
          foreach ($p in $expected) {
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) {
              throw "Missing downloaded native binary: $p"
            }
          }
      - name: Check version
        shell: pwsh
        run: |
          $version = (Get-Content plugin.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and plugin version differ' }
      - run: npm ci
      - run: node tools/build.mjs --check
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - name: Package desktop/CLI ZIP with native binaries
        env:
          AG_PULSE_REQUIRE_NATIVE: '1'
        run: python manage.py package --require-native
      - name: Package IDE VSIX with native binaries
        env:
          AG_PULSE_REQUIRE_NATIVE: '1'
        run: python ide/package.py --require-native
      - name: Publish desktop/CLI ZIP and IDE VSIX with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          AG_PULSE_REQUIRE_NATIVE: '1'
        run: python tools/publish-release.py
